<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>纪念市杂谈</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: #0a0a1a; font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; padding: 12px; margin: 0; }
        #starCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; }
        .card { position: relative; display: flex; flex-direction: row; background: #111; border-radius: 24px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.06) inset; max-width: 98vw; max-height: 92vh; z-index: 1; width: min(1200px, 96vw); aspect-ratio: auto; margin: 0 auto; }
        .stage { position: relative; flex: 1; aspect-ratio: 4/3; min-height: 0; background: #0a0a1a; overflow: hidden; }
        .bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; background-size: cover; background-position: center; background-repeat: no-repeat; z-index: 0; }
        .bg-layer { background-image: url('https://cdn.jsdelivr.net/gh/Mizii1208/-2026-/446dc1f2599abf8cd4f69b60617b86ee.jpg'); }
        .bg-layer::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(20,20,50,0.15) 0%, rgba(0,0,0,0.30) 100%); z-index: 0; }
        .danmaku-layer { position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
        .danmaku-item { position: absolute; white-space: nowrap; font-weight: 700; letter-spacing: 0.2px; text-shadow: 0 0 12px rgba(0,0,0,0.9), 0 0 30px rgba(0,0,0,0.6); will-change: transform, opacity; pointer-events: none; opacity: 0; animation: danmakuFly linear forwards; border-radius: 40px; padding: 0 2px; font-size: 16px; right: 0; transform: translateX(0); }
        .danmaku-item.is-other::before { content: '👤 '; font-weight: 400; opacity: 0.6; margin-right: 2px; }
        @keyframes danmakuFly { 0% { transform: translateX(0); opacity: 0; } 3% { opacity: 1; transform: translateX(0); } 90% { opacity: 1; } 100% { transform: translateX(-120vw); opacity: 0; } }
        .status-overlay { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 5; display: flex; justify-content: space-between; align-items: center; pointer-events: none; flex-wrap: wrap; gap: 4px; }
        .badge { background: rgba(0,0,0,0.50); backdrop-filter: blur(8px); padding: 3px 12px; border-radius: 40px; color: rgba(255,255,255,0.7); font-size: 11px; font-weight: 500; border: 1px solid rgba(255,255,255,0.06); pointer-events: none; display: flex; align-items: center; gap: 4px; }
        .badge span { color: #fff; font-weight: 700; }
        .badge.online .dot { display: inline-block; width: 6px; height: 6px; background: #2ecc71; border-radius: 50%; box-shadow: 0 0 12px #2ecc71; animation: pulse-dot 1.5s ease-in-out infinite; }
        @keyframes pulse-dot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.4; transform:scale(0.8); } }
        .refresh-btn { position: absolute; bottom: 20px; right: 16px; z-index: 8; background: rgba(0,0,0,0.55); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08); border-radius: 40px; color: #fff; padding: 5px 14px; font-size: 12px; cursor: pointer; pointer-events: all; display: flex; align-items: center; gap: 4px; }
        .refresh-btn:hover { background: rgba(255,255,255,0.12); }
        .chat-panel { width: 260px; min-width: 200px; max-width: 300px; height: 100%; background: rgba(10,10,25,0.80); backdrop-filter: blur(16px); border-left: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; flex-shrink: 0; position: relative; transition: width 0.2s ease; }
        .name-hint { padding: 4px 12px; background: rgba(255,215,0,0.08); text-align: center; font-size: 11px; color: rgba(255,215,0,0.6); flex-shrink: 0; animation: hintFade 5s ease forwards; opacity: 0; transform: translateY(-4px); }
        .name-hint.show { opacity: 1; transform: translateY(0); }
        @keyframes hintFade { 0% { opacity: 0; transform: translateY(-4px); } 10% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-4px); } }
        .music-player { padding: 6px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.15); flex-shrink: 0; display: flex; align-items: center; gap: 8px; min-height: 44px; }
        .music-player .info { flex: 1; min-width: 0; }
        .music-player .info .title { font-size: 13px; font-weight: 700; color: #FFD700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .music-player .info .artist { font-size: 11px; color: rgba(255,255,255,0.50); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .music-player .controls { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .music-player .controls button { background: rgba(255,255,255,0.06); border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 13px; cursor: pointer; transition: 0.2s; color: #fff; display: flex; align-items: center; justify-content: center; }
        .music-player .controls button:hover { background: rgba(255,255,255,0.14); }
        .music-player .controls button.active { background: rgba(255,215,0,0.20); color: #FFD700; }
        .music-player .controls .play-btn { width: 34px; height: 34px; font-size: 16px; background: linear-gradient(135deg, #FFD700, #9B59B6); color: #fff; box-shadow: 0 2px 12px rgba(155,89,182,0.25); }
        .music-player .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #2ecc71; animation: pulse-dot 1.5s ease-in-out infinite; }
        .music-player .status-dot.paused { background: #888; animation: none; }
        .chat-header { padding: 4px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; background: rgba(0,0,0,0.08); }
        .chat-header .nickname-area { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.8); cursor: pointer; padding: 2px 8px; border-radius: 20px; background: rgba(255,255,255,0.04); }
        .chat-header .nickname-area .avatar { font-size: 14px; }
        .chat-header .nickname-area .name { color: #fff; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-header .online-status { font-weight:400; font-size:10px; color:#2ecc71; display:flex; align-items:center; gap:3px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 6px 10px; display: flex; flex-direction: column; gap: 4px; scroll-behavior: smooth; min-height: 0; }
        .chat-messages::-webkit-scrollbar { width: 3px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        .msg-item { display: flex; align-items: baseline; gap: 4px; font-size: 12px; line-height: 1.3; color: rgba(255,255,255,0.85); word-break: break-word; animation: msgFade 0.25s ease; }
        .msg-item .avatar { font-size: 12px; flex-shrink:0; }
        .msg-item .name { font-weight:600; color:#A8D8EA; flex-shrink:0; max-width:50px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .msg-item .name.me { color:#f093fb; }
        .msg-item .time { font-size:9px; color:rgba(255,255,255,0.25); flex-shrink:0; margin-left:auto; }
        .msg-item .content { flex:1; }
        .msg-item.is-other .name { color:#7EC8E3; }
        @keyframes msgFade { 0% { opacity:0; transform:translateY(10px); } 100% { opacity:1; transform:translateY(0); } }
        .chat-input-area { padding: 6px 10px 10px 10px; border-top: 1px solid rgba(255,255,255,0.04); display: flex; gap: 6px; flex-shrink: 0; align-items: center; background: rgba(0,0,0,0.2); }
        .chat-input-area input { flex: 1; padding: 6px 12px; border: none; border-radius: 40px; background: rgba(255,255,255,0.08); color: #fff; font-size: 13px; outline: none; height: 34px; min-width: 40px; }
        .chat-input-area input::placeholder { color:rgba(255,255,255,0.3); font-size:12px; }
        .chat-input-area input:focus { background:rgba(255,255,255,0.14); }
        .chat-input-area .btn-send { padding: 0 16px; height: 34px; border: none; border-radius: 40px; background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .music-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(3px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; cursor: pointer; color: #fff; font-size: 18px; font-weight: 700; text-shadow: 0 0 20px rgba(0,0,0,0.8); transition: opacity 0.5s ease; opacity: 1; pointer-events: all; border-radius: 24px 0 0 24px; }
        .music-overlay.hidden { opacity: 0; pointer-events: none; }
        .music-overlay .icon { font-size: 48px; margin-bottom: 12px; }
        .music-overlay .sub { font-size: 14px; font-weight: 400; opacity: 0.8; margin-top: 8px; }
        .music-overlay .play-btn-big { margin-top: 16px; padding: 10px 40px; border-radius: 40px; background: linear-gradient(135deg, #FFD700, #9B59B6); border: none; color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 30px rgba(155,89,182,0.4); transition: transform 0.2s; }
        .music-overlay .play-btn-big:hover { transform: scale(1.05); }
        .music-overlay .play-btn-big:active { transform: scale(0.95); }
        .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(0,0,0,0.85); backdrop-filter: blur(14px); color: #fff; padding: 8px 24px; border-radius: 50px; font-size: 13px; font-weight: 500; z-index: 999; opacity: 0; transition: all 0.4s ease; pointer-events: none; border: 1px solid rgba(255,255,255,0.06); white-space: nowrap; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        @media (max-width: 820px) { body { padding: 0; align-items: stretch; } .card { flex-direction: column; max-height: 100vh; width: 100vw; border-radius: 0; max-width: none; aspect-ratio: auto; margin: 0; } .stage { width: 100%; flex: none; height: 45vh; aspect-ratio: auto; min-height: 0; } .chat-panel { width: 100% !important; min-width: 0; max-width: 100%; height: 55vh; border-left: none; border-top: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; } .music-overlay { border-radius: 0; } .refresh-btn { bottom: 12px; right: 10px; font-size: 10px; padding: 3px 10px; } .status-overlay { top: 8px; left: 8px; right: 8px; } .badge { font-size: 9px; padding: 2px 8px; } .music-player .info .title { font-size: 12px; } .music-player .info .artist { font-size: 10px; } .music-player .controls button { width: 26px; height: 26px; font-size: 12px; } .music-player .controls .play-btn { width: 30px; height: 30px; font-size: 14px; } .danmaku-item { font-size: 14px !important; } .chat-header .nickname-area .name { max-width: 50px; } }
        @media (max-width: 480px) { .stage { height: 40vh; } .chat-panel { height: 60vh; } .chat-messages { padding: 4px 8px; gap: 3px; } .msg-item { font-size: 11px; } .chat-input-area input { font-size: 12px; height: 30px; } .chat-input-area .btn-send { height: 30px; font-size: 12px; padding: 0 12px; } .music-player { min-height: 36px; padding: 4px 10px; } .music-player .info .title { font-size: 11px; } .music-player .info .artist { font-size: 9px; } .music-player .controls button { width: 22px; height: 22px; font-size: 11px; } .music-player .controls .play-btn { width: 26px; height: 26px; font-size: 13px; } .name-hint { font-size: 10px; padding: 2px 8px; } .chat-header .nickname-area { font-size: 11px; } .chat-header .nickname-area .avatar { font-size: 12px; } .chat-header .online-status { font-size: 9px; } .refresh-btn { bottom: 8px; right: 8px; font-size: 9px; padding: 2px 8px; } .toast { font-size: 11px; padding: 5px 16px; bottom: 80px; } }
    </style>
</head>
<body>

    <canvas id="starCanvas"></canvas>

    <div class="card" id="card">
        <div class="stage" id="stage">
            <div class="bg-layer" id="bgLayer"></div>
            <div class="danmaku-layer" id="danmakuLayer"></div>
            <div class="status-overlay">
                <div class="badge">💬 <span id="countNum">0</span></div>
                <div class="badge online"><span class="dot"></span> 实时</div>
                <div class="badge">📷 双击换图</div>
            </div>
            <button class="refresh-btn" id="refreshBtn">🔄 刷新弹幕</button>
            <div class="music-overlay" id="musicOverlay">
                <div class="icon">🎵</div>
                <div>点击播放音乐</div>
                <div class="sub">Carly Rae Jepsen - After All</div>
                <button class="play-btn-big" id="bigPlayBtn">▶ 播放</button>
            </div>
        </div>

        <div class="chat-panel" id="chatPanel">
            <div class="name-hint" id="nameHint">
                <span class="icon">💡</span> 点击昵称可修改名字
            </div>
            <div class="music-player" id="musicPlayer">
                <div class="info">
                    <div class="title" id="songTitle">🎵 After All</div>
                    <div class="artist" id="songArtist">Carly Rae Jepsen</div>
                </div>
                <div class="controls">
                    <button id="loopBtn" class="loop-btn active" title="循环播放">🔁</button>
                    <button id="playBtn" class="play-btn" title="播放/暂停">⏸</button>
                </div>
                <span class="status-dot" id="playStatusDot"></span>
            </div>
            <div class="chat-header">
                <div class="nickname-area" id="nicknameArea" title="点击修改昵称">
                    <span class="avatar" id="myAvatar">🙋</span>
                    <span class="name" id="myNameDisplay">陌生人</span>
                    <span class="edit-icon">✎</span>
                </div>
                <div class="online-status">
                    <span class="dot-sm"></span> 实时
                </div>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="说点什么… (回车发送)" maxlength="120" autocomplete="off" />
                <button class="btn-send" id="chatSendBtn">发送</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  使用 GitHub Issues 存储消息（需要 public_repo Token）
        //  请替换下方的 YOUR_TOKEN
        // ============================================================
        const GITHUB_TOKEN = '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\'; // ← 替换为您的 Token
        const REPO_OWNER = 'Mizii1208';
        const REPO_NAME = '2026-QIXI';
        const ISSUE_NUMBER = 1;
        const ISSUE_API = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues/${ISSUE_NUMBER}/comments`;

        (function() {
            'use strict';

            // DOM 引用
            const bgLayer = document.getElementById('bgLayer');
            const danmakuLayer = document.getElementById('danmakuLayer');
            const chatMessages = document.getElementById('chatMessages');
            const chatInput = document.getElementById('chatInput');
            const chatSendBtn = document.getElementById('chatSendBtn');
            const countNum = document.getElementById('countNum');
            const toast = document.getElementById('toast');
            const nicknameArea = document.getElementById('nicknameArea');
            const myAvatarSpan = document.getElementById('myAvatar');
            const myNameSpan = document.getElementById('myNameDisplay');
            const refreshBtn = document.getElementById('refreshBtn');
            const playBtn = document.getElementById('playBtn');
            const loopBtn = document.getElementById('loopBtn');
            const playStatusDot = document.getElementById('playStatusDot');
            const musicOverlay = document.getElementById('musicOverlay');
            const bigPlayBtn = document.getElementById('bigPlayBtn');
            const nameHint = document.getElementById('nameHint');
            const starCanvas = document.getElementById('starCanvas');

            // 音乐配置
            const MUSIC_URL = 'https://cdn.jsdelivr.net/gh/Mizii1208/After-all/After%20All.mp3';
            const MAX_DANMAKU = 80;
            const MAX_HISTORY = 150;
            const STORAGE_KEY = 'chat_history_issues';
            const USER_KEY = 'user_info_issues';
            const DEFAULT_BG = 'https://cdn.jsdelivr.net/gh/Mizii1208/-2026-/446dc1f2599abf8cd4f69b60617b86ee.jpg';

            const COLORS = ['#FFD700','#FFC107','#FFB300','#FDD835','#FFEE58','#FFF176','#9B59B6','#8E44AD','#A855F7','#7C3AED','#6D28D9','#9333EA'];
            function getRandomColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

            // ===== 用户身份 =====
            let myName = localStorage.getItem(USER_KEY) ? JSON.parse(localStorage.getItem(USER_KEY)).name : '陌生人';
            let myAvatar = localStorage.getItem(USER_KEY) ? JSON.parse(localStorage.getItem(USER_KEY)).avatar : '🙋';
            if (!localStorage.getItem(USER_KEY)) {
                const avatars = ['😊','😎','🤩','😺','🐶','🦊','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🐤','🐣','🐥','🦄','🐲','🐉','🐳','🐬','🐟','🐠','🐡','🦈','🐙','🦑','🐚','🐌','🦋','🐛','🐜','🐝','🐞','🦗','🦂','🕷️','🕸️','🦀','🦞','🦐','🐢','🐍','🦎','🦖','🦕','🐊','🐇','🐈','🐕','🐩','🐖','🐄','🐏','🐑','🐐','🐃','🐂','🐘','🦏','🦍','🐒'];
                myName = '陌生人';
                myAvatar = avatars[Math.floor(Math.random() * avatars.length)];
                localStorage.setItem(USER_KEY, JSON.stringify({ name: myName, avatar: myAvatar }));
            }
            function updateNicknameUI() { myAvatarSpan.textContent = myAvatar; myNameSpan.textContent = myName; }
            updateNicknameUI();
            function changeNickname() {
                const newName = prompt('请输入你的新昵称（留空则恢复为“陌生人”）：', myName);
                if (newName !== null) {
                    const trimmed = newName.trim();
                    if (trimmed === '') myName = '陌生人';
                    else myName = trimmed;
                    const avatars = ['😊','😎','🤩','😺','🐶','🦊','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🐤','🐣','🐥','🦄','🐲','🐉','🐳','🐬','🐟','🐠','🐡','🦈','🐙','🦑','🐚','🐌','🦋','🐛','🐜','🐝','🐞','🦗','🦂','🕷️','🕸️','🦀','🦞','🦐','🐢','🐍','🦎','🦖','🦕','🐊','🐇','🐈','🐕','🐩','🐖','🐄','🐏','🐑','🐐','🐃','🐂','🐘','🦏','🦍','🐒'];
                    myAvatar = avatars[Math.floor(Math.random() * avatars.length)];
                    localStorage.setItem(USER_KEY, JSON.stringify({ name: myName, avatar: myAvatar }));
                    updateNicknameUI();
                    showToast('✅ 昵称已更新为: ' + myName, 1500);
                }
            }
            nicknameArea.addEventListener('click', changeNickname);

            // ===== BroadcastChannel（同浏览器多标签） =====
            let channel = null;
            try { channel = new BroadcastChannel('danmaku_channel_issues'); } catch(_) {}

            // ===== 本地存储 =====
            function loadLocalHistory() {
                try {
                    const data = localStorage.getItem(STORAGE_KEY);
                    if (data) {
                        const msgs = JSON.parse(data);
                        if (Array.isArray(msgs)) return msgs.slice(-MAX_HISTORY);
                    }
                } catch(_) {}
                return [];
            }
            function saveLocalHistory(msgs) {
                try {
                    const sliced = msgs.slice(-MAX_HISTORY);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(sliced));
                } catch(_) {}
            }
            let chatMessagesData = loadLocalHistory();

            // ===== 弹幕管理 =====
            let danmakuCount = 0;
            function updateCounter() { countNum.textContent = danmakuCount; }
            function renderDanmaku(text, isOther = false) {
                if (!text || text.trim() === '') return false;
                if (danmakuCount >= MAX_DANMAKU) {
                    const first = danmakuLayer.querySelector('.danmaku-item');
                    if (first) { first.remove(); danmakuCount--; } else return false;
                }
                const el = document.createElement('div');
                el.className = 'danmaku-item';
                if (isOther) el.classList.add('is-other');
                const fontSize = Math.floor(Math.random() * 8) + 14;
                const duration = Math.floor(Math.random() * 10) + 12;
                const top = Math.random() * 80 + 5;
                el.textContent = text;
                el.style.fontSize = fontSize + 'px';
                el.style.top = top + '%';
                el.style.animationDuration = duration + 's';
                el.style.animationDelay = (Math.random() * 0.5) + 's';
                el.style.color = getRandomColor();
                danmakuLayer.appendChild(el);
                danmakuCount++;
                updateCounter();
                el.addEventListener('animationend', function() { el.remove(); danmakuCount--; updateCounter(); });
                setTimeout(() => { if (el.parentNode) { el.remove(); danmakuCount--; updateCounter(); } }, (duration + 2) * 1000);
                return true;
            }

            // ===== 渲染聊天 =====
            function renderChatMessage(msg) {
                const div = document.createElement('div');
                div.className = 'msg-item';
                if (msg.isOther) div.classList.add('is-other');
                if (msg.isMe) div.classList.add('me');
                const avatarSpan = document.createElement('span'); avatarSpan.className = 'avatar'; avatarSpan.textContent = msg.avatar || '👤';
                const nameSpan = document.createElement('span'); nameSpan.className = 'name'; if (msg.isMe) nameSpan.classList.add('me'); nameSpan.textContent = msg.name || '陌生人';
                const contentSpan = document.createElement('span'); contentSpan.className = 'content'; contentSpan.textContent = msg.text;
                const timeSpan = document.createElement('span'); timeSpan.className = 'time';
                if (msg.time) { const d = new Date(msg.time); timeSpan.textContent = d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'}); } else { timeSpan.textContent = '刚刚'; }
                div.appendChild(avatarSpan); div.appendChild(nameSpan); div.appendChild(contentSpan); div.appendChild(timeSpan);
                chatMessages.appendChild(div);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // ===== 从 Issue 评论加载历史 =====
            function loadFromIssues() {
                const headers = {
                    'Content-Type': 'application/json',
                    'Authorization': `token ${GITHUB_TOKEN}`
                };
                fetch(ISSUE_API, { headers })
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(comments => {
                    const cloudMsgs = [];
                    for (const comment of comments) {
                        try {
                            const data = JSON.parse(comment.body);
                            if (data && data.text && data.name) {
                                cloudMsgs.push({
                                    id: comment.id,
                                    text: data.text,
                                    name: data.name || '陌生人',
                                    avatar: data.avatar || '👤',
                                    time: new Date(comment.created_at).getTime(),
                                    isOther: true,
                                    isMe: false
                                });
                            }
                        } catch(e) {}
                    }
                    const localIds = new Set(chatMessagesData.map(m => m.id));
                    let added = 0;
                    for (const msg of cloudMsgs) {
                        if (!localIds.has(msg.id)) {
                            chatMessagesData.push(msg);
                            renderChatMessage(msg);
                            renderDanmaku(msg.text, true);
                            added++;
                        }
                    }
                    if (added > 0) {
                        saveLocalHistory(chatMessagesData);
                        showToast(`✅ 同步了 ${added} 条新消息`, 2000);
                    }
                })
                .catch(err => {
                    console.warn('读取 Issue 评论失败:', err);
                });
            }

            // ===== 写入 Issue 评论 =====
            function writeToIssues(msgObj) {
                const body = JSON.stringify({
                    text: msgObj.text,
                    name: msgObj.name,
                    avatar: msgObj.avatar,
                    time: msgObj.time
                });
                const headers = {
                    'Content-Type': 'application/json',
                    'Authorization': `token ${GITHUB_TOKEN}`
                };
                return fetch(ISSUE_API, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ body: body })
                })
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(comment => {
                    msgObj.id = comment.id;
                    saveLocalHistory(chatMessagesData);
                    showToast('✅ 消息已保存到云端', 1500);
                })
                .catch(err => {
                    console.error('写入 Issue 失败:', err);
                    showToast('⚠️ 保存失败，请检查 Token', 2000);
                });
            }

            // ===== 添加消息 =====
            function addMessage(text, isOther = false, senderName = null, senderAvatar = null, timestamp = null) {
                if (!text || text.trim() === '') return false;
                text = text.trim();
                const time = timestamp || Date.now();
                const name = senderName || (isOther ? '陌生人' : myName);
                const avatar = senderAvatar || (isOther ? '👤' : myAvatar);
                const isMe = !isOther;
                const msgObj = { id: `temp_${Date.now()}_${Math.random().toString(36).substr(2,4)}`, text, name, avatar, isOther, isMe, time };

                chatMessagesData.push(msgObj);
                saveLocalHistory(chatMessagesData);
                renderChatMessage(msgObj);
                if (isMe) renderDanmaku(text, false);
                else renderDanmaku(text, true);

                if (channel) { try { channel.postMessage({ type: 'new_message', data: msgObj }); } catch(_) {} }

                if (isMe) {
                    writeToIssues(msgObj);
                }
                return true;
            }

            // ===== 发送消息 =====
            function sendMyMessage() {
                const text = chatInput.value.trim();
                if (!text) { showToast('💬 输入点内容吧', 1000); return; }
                addMessage(text, false);
                chatInput.value = '';
                chatInput.focus();
            }

            function refreshDanmaku() {
                danmakuLayer.querySelectorAll('.danmaku-item').forEach(el => el.remove());
                danmakuCount = 0;
                updateCounter();
                showToast('🔄 弹幕已清空', 1200);
            }

            function showToast(text, duration = 2000) {
                toast.textContent = text;
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => { toast.classList.remove('show'); }, duration);
            }

            // ===== 背景 =====
            function setBackgroundImage(src) {
                bgLayer.style.backgroundImage = `url('${src}')`;
                const img = new Image();
                img.onerror = () => { if (src !== DEFAULT_BG) { bgLayer.style.backgroundImage = `url('${DEFAULT_BG}')`; showToast('⚠️ 图片加载失败，恢复默认', 1800); } };
                img.src = src;
            }
            function resetBackground() { setBackgroundImage(DEFAULT_BG); showToast('🔄 默认背景', 1200); }

            // ===== 星星 =====
            let starCtx, starWidth, starHeight, stars = [], starAnimId = null;
            function initStars() {
                starWidth = window.innerWidth;
                starHeight = window.innerHeight;
                starCanvas.width = starWidth;
                starCanvas.height = starHeight;
                starCtx = starCanvas.getContext('2d');
                const count = 200;
                stars = [];
                const colors = ['#FFFFFF', '#FFF8E7', '#FFD700', '#FFB6C1', '#87CEEB', '#FFF0F5', '#FFE4B5', '#E6E6FA'];
                for (let i = 0; i < count; i++) {
                    stars.push({
                        x: Math.random() * starWidth,
                        y: Math.random() * starHeight,
                        radius: Math.random() * 4 + 1.5,
                        vx: (Math.random() - 0.5) * 0.6,
                        vy: (Math.random() - 0.5) * 0.6,
                        speed: Math.random() * 0.03 + 0.01,
                        phase: Math.random() * Math.PI * 2,
                        baseAlpha: Math.random() * 0.5 + 0.3,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        glow: Math.random() * 10 + 4,
                        wobble: Math.random() * 0.02 + 0.005
                    });
                }
                animateStars();
            }
            function animateStars() {
                if (!starCtx) return;
                starCtx.clearRect(0, 0, starWidth, starHeight);
                const time = Date.now() / 1000;
                for (const star of stars) {
                    star.x += star.vx + Math.sin(time * star.wobble + star.phase) * 0.15;
                    star.y += star.vy + Math.cos(time * star.wobble * 0.7 + star.phase) * 0.15;
                    if (star.x < -20) star.x = starWidth + 20;
                    if (star.x > starWidth + 20) star.x = -20;
                    if (star.y < -20) star.y = starHeight + 20;
                    if (star.y > starHeight + 20) star.y = -20;
                    const alpha = star.baseAlpha * (0.5 + 0.5 * Math.sin(time * star.speed * 12 + star.phase));
                    const r = star.radius * (0.85 + 0.15 * Math.sin(time * star.speed * 8 + star.phase + 1.2));
                    starCtx.beginPath();
                    starCtx.arc(star.x, star.y, r, 0, Math.PI * 2);
                    starCtx.fillStyle = star.color;
                    starCtx.globalAlpha = Math.max(0.05, alpha);
                    starCtx.shadowColor = star.color;
                    starCtx.shadowBlur = star.glow * (0.5 + 0.5 * Math.sin(time * star.speed * 7 + star.phase * 0.5));
                    starCtx.fill();
                }
                starCtx.globalAlpha = 1;
                starCtx.shadowBlur = 0;
                starAnimId = requestAnimationFrame(animateStars);
            }
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (starAnimId) { cancelAnimationFrame(starAnimId); starAnimId = null; }
                    starWidth = window.innerWidth; starHeight = window.innerHeight;
                    starCanvas.width = starWidth; starCanvas.height = starHeight;
                    for (const star of stars) { star.x = Math.max(0, Math.min(starWidth, star.x)); star.y = Math.max(0, Math.min(starHeight, star.y)); }
                    animateStars();
                }, 300);
            });

            // ===== 音频 =====
            let audio = null, isPlaying = false, isLoop = true;
            function initAudio() {
                audio = new Audio(MUSIC_URL);
                audio.loop = isLoop;
                audio.preload = 'auto';
                audio.addEventListener('play', () => { isPlaying = true; updatePlayUI(); hideOverlay(); if (channel) { try { channel.postMessage({ type: 'music_toggle', action: 'play' }); } catch(_) {} } });
                audio.addEventListener('pause', () => { isPlaying = false; updatePlayUI(); if (channel) { try { channel.postMessage({ type: 'music_toggle', action: 'pause' }); } catch(_) {} } });
                audio.addEventListener('ended', () => { if (isLoop) { audio.currentTime = 0; audio.play().catch(() => {}); } else { isPlaying = false; updatePlayUI(); } });
                audio.addEventListener('error', () => { showToast('⚠️ 音频加载失败', 2500); isPlaying = false; updatePlayUI(); });
                audio.play().then(() => { isPlaying = true; updatePlayUI(); hideOverlay(); showToast('🎵 正在播放', 2000); }).catch(() => { isPlaying = false; updatePlayUI(); showOverlay(); });
            }
            function showOverlay() { musicOverlay.classList.remove('hidden'); }
            function hideOverlay() { musicOverlay.classList.add('hidden'); }
            function updatePlayUI() {
                playBtn.textContent = isPlaying ? '⏸' : '▶';
                playStatusDot.className = isPlaying ? 'status-dot' : 'status-dot paused';
                loopBtn.classList.toggle('active', isLoop);
                if (audio) audio.loop = isLoop;
                if (isPlaying) hideOverlay();
            }
            function togglePlay() { if (!audio) return; if (isPlaying) audio.pause(); else audio.play().catch(() => { showToast('⚠️ 播放失败', 1500); }); }
            function toggleLoop() { isLoop = !isLoop; if (audio) audio.loop = isLoop; loopBtn.classList.toggle('active', isLoop); showToast(isLoop ? '🔁 循环已开启' : '🔁 循环已关闭', 1200); }
            function startPlayFromOverlay(e) { e.stopPropagation(); if (audio && !isPlaying) { audio.play().then(() => { isPlaying = true; updatePlayUI(); hideOverlay(); showToast('🎵 正在播放', 2000); }).catch(() => { showToast('⚠️ 播放失败', 1500); }); } }
            musicOverlay.addEventListener('click', startPlayFromOverlay);
            bigPlayBtn.addEventListener('click', startPlayFromOverlay);

            function showNameHint() { nameHint.classList.add('show'); setTimeout(() => { nameHint.classList.remove('show'); }, 5500); }

            // ===== 事件绑定 =====
            chatSendBtn.addEventListener('click', sendMyMessage);
            chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendMyMessage(); } });
            document.getElementById('stage').addEventListener('dblclick', (e) => { if (e.target.closest('.chat-panel')) return; resetBackground(); });
            document.getElementById('stage').addEventListener('contextmenu', (e) => { e.preventDefault(); if (e.target.closest('.chat-panel')) return; resetBackground(); });
            refreshBtn.addEventListener('click', refreshDanmaku);
            playBtn.addEventListener('click', togglePlay);
            loopBtn.addEventListener('click', toggleLoop);

            if (channel) { channel.onmessage = (e) => { handleBroadcast(e.data); }; channel.postMessage({ type: 'ping' }); }

            function handleBroadcast(data) {
                if (!data) return;
                if (data.type === 'new_message' && data.data) {
                    const msg = data.data;
                    const exists = chatMessagesData.some(m => m.id === msg.id);
                    if (!exists) {
                        msg.isOther = true;
                        msg.isMe = false;
                        chatMessagesData.push(msg);
                        saveLocalHistory(chatMessagesData);
                        renderChatMessage(msg);
                        renderDanmaku(msg.text, true);
                    }
                } else if (data.type === 'music_toggle') {
                    if (audio && data.action === 'play') { audio.play().catch(() => {}); }
                    else if (audio && data.action === 'pause') { audio.pause(); }
                }
            }

            // ===== 初始化 =====
            function init() {
                // 加载历史（即使失败也不影响按钮点击）
                loadFromIssues();

                setBackgroundImage(DEFAULT_BG);
                setTimeout(initStars, 50);
                initAudio();
                setTimeout(() => chatInput.focus(), 500);
                setTimeout(showNameHint, 800);
                setInterval(loadFromIssues, 10000);
                console.log('🎯 纪念市杂谈 (Issues版) 已启动');
                showToast('💡 消息将同步到 GitHub Issues，跨设备可见', 3000);
            }

            if (document.readyState === 'complete') { init(); } else { window.addEventListener('load', init); }

            window.__chat = {
                send: sendMyMessage,
                refresh: refreshDanmaku,
                history: () => chatMessagesData,
                clearHistory: () => {
                    chatMessagesData = [];
                    saveLocalHistory([]);
                    chatMessages.innerHTML = '';
                    showToast('🗑️ 本地历史已清空', 1200);
                },
                music: { play: () => { if (audio) audio.play().catch(() => {}); }, pause: () => { if (audio) audio.pause(); }, toggle: togglePlay, loop: toggleLoop }
            };

        })();
    </script>
</body>
