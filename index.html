<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>测试遮罩</title></head>
<body style="margin:0; height:100vh; background:#0a0a1a; display:flex; justify-content:center; align-items:center;">
    <div style="position:relative; width:80vw; height:60vh; background:url('https://cdn.jsdelivr.net/gh/Mizii1208/-2026-/446dc1f2599abf8cd4f69b60617b86ee.jpg') center/cover; border-radius:20px; overflow:hidden;">
        <div id="overlay" style="position:absolute; inset:0; background:rgba(0,0,0,0.7); display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; font-size:24px; transition:opacity 0.5s;">
            <div>🎵</div>
            <div>点击播放音乐</div>
            <button id="playBig" style="margin-top:20px; padding:12px 40px; border-radius:40px; background:linear-gradient(135deg,#FFD700,#9B59B6); border:none; color:#fff; font-size:20px; cursor:pointer;">▶ 播放</button>
        </div>
    </div>
    <script>
        document.getElementById('playBig').addEventListener('click', function() {
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('overlay').style.display = 'none', 500);
        });
    </script>
</body>
</html>
